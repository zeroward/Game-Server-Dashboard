# Explicit opt-in: docker compose -f compose.yaml -f compose.vpn.yaml ...
# The gateway alone has network privileges, confined to its own namespace.
services:
  portal:
    environment:
      VPN_ENABLED: "true"
      VPN_CONTROL_DIR: /control
      VPN_DELIVERY_DIR: /delivery
      VPN_ENDPOINT: ${VPN_ENDPOINT:?Set VPN_ENDPOINT to the operator-controlled host:UDP-port}
    volumes:
      - vpn-control:/control
      - vpn-delivery:/delivery
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: waypoint-gateway:local
    user: "0:65532"
    environment:
      VPN_CONTROL_DIR: /control
      GATEWAY_DATA_DIR: /gateway
      WG_PORT: "51820"
    volumes:
      - vpn-control:/control:ro
      - vpn-gateway:/gateway
    ports:
      - "${VPN_BIND_IP:-127.0.0.1}:${VPN_UDP_PORT:-51820}:51820/udp"
    networks:
      - vpn-egress
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "0"
      net.ipv6.conf.all.disable_ipv6: "1"
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    restart: unless-stopped
    depends_on: [portal]
volumes:
  # Docker initializes the empty volume from the portal image, with portal ownership.
  vpn-control:
  vpn-gateway:
  vpn-delivery:
networks:
  vpn-egress:
