services:
  portal:
    build: .
    image: waypoint:local
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      DATA_DIR: /data
      LISTEN_ADDR: 0.0.0.0:8080
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - waypoint-data:/data
    healthcheck:
      test: ["CMD", "/waypoint", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
  browser-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: tests/Dockerfile
    volumes:
      - ./test-results:/work/test-results
    entrypoint: ["node", "/work/tests/browser.cjs"]
volumes:
  waypoint-data:
