# Start the configured portal, VPN gateway, and HTTPS tunnel: docker compose up -d --build
services:
  portal:
    build: .
    image: waypoint:local
    init: true
    environment:
      APP_ENV: production
      BASE_URL: https://${TUNNEL_HOSTNAME:?Set TUNNEL_HOSTNAME to your portal hostname without a scheme or path}
      DATA_DIR: /data
      LISTEN_ADDR: 0.0.0.0:8080
      TRUSTED_PROXIES: ${TUNNEL_CONNECTOR_IP:-172.30.250.2}/32
      VPN_ENABLED: "true"
      VPN_CONTROL_DIR: /control
      VPN_DELIVERY_DIR: /delivery
      VPN_ENDPOINT: ${VPN_ENDPOINT:?Set VPN_ENDPOINT to your reachable WireGuard host:UDP-port}
    volumes:
      - waypoint-data:/data
      - vpn-control:/control
      - vpn-delivery:/delivery
    networks:
      tunnel:
        ipv4_address: ${TUNNEL_PORTAL_IP:-172.30.250.3}
    healthcheck:
      test: ["CMD", "/waypoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: waypoint-gateway:local
    user: "0:65532"
    environment:
      VPN_CONTROL_DIR: /control
      GATEWAY_DATA_DIR: /gateway
      WG_PORT: "51820"
    volumes:
      - vpn-control:/control:ro
      - vpn-gateway:/gateway
    ports:
      - "${VPN_BIND_IP:-127.0.0.1}:${VPN_UDP_PORT:-51820}:51820/udp"
    networks:
      - vpn-egress
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "0"
      net.ipv6.conf.all.disable_ipv6: "1"
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    restart: unless-stopped
    depends_on:
      portal:
        condition: service_healthy
  cloudflared:
    image: cloudflare/cloudflared:2026.8.3@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
    user: "65532:65532"
    command:
      - tunnel
      - --no-autoupdate
      - --loglevel
      - warn
      - --metrics
      - 127.0.0.1:2000
      - run
      - --token-file
      - /run/secrets/cloudflare-token
    volumes:
      - type: bind
        source: ${TUNNEL_TOKEN_FILE:-./secrets/cloudflare-token}
        target: /run/secrets/cloudflare-token
        read_only: true
        bind:
          create_host_path: false
          selinux: Z
    networks:
      tunnel:
        ipv4_address: ${TUNNEL_CONNECTOR_IP:-172.30.250.2}
    depends_on:
      portal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
  browser-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: tests/Dockerfile
    volumes:
      - ./test-results:/work/test-results
    entrypoint: ["node", "/work/tests/browser.cjs"]
volumes:
  waypoint-data:
  vpn-control:
  vpn-gateway:
  vpn-delivery:
networks:
  vpn-egress:
  tunnel:
    ipam:
      config:
        - subnet: ${TUNNEL_SUBNET:-172.30.250.0/29}
